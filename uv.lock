    { name = "dr-exec" },
    { name = "dr-graph" },
    { name = "dr-providers" },
    { name = "dr-serialize" },
    { name = "dr-store" },
    { name = "gepa" },
    { name = "mcp" },
    { name = "numpy" },
    { name = "optuna" },
    { name = "rich" },
    { name = "typer" },
    { name = "uvicorn" },
]

[package.optional-dependencies]
dbos = [
    { name = "dbos" },
]
platform = [
    { name = "dbos", extra = ["otel"] },
    { name = "dr-platform" },
    { name = "psycopg", extra = ["binary"] },
]
