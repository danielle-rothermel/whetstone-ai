# Pre-commit and pre-push run the repository's complete local gate.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: pre-check
        name: Pre-check (defs + ruff + ty + pytest)
        entry: scripts/pre-check.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
