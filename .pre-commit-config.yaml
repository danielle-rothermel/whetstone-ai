# Pre-commit runs the repository's fast local gate. Full tests run in CI.
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: fast-precheck
        name: Fast precheck (structural defs + ruff + ty + selected tests)
        entry: scripts/pre-check.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
