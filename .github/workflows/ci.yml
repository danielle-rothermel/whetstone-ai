name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whetstone_platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point tests at the postgres service container
        run: |
          postgres_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          test -n "$postgres_ip"
          echo "WHETSTONE_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@${postgres_ip}:5432/whetstone_platform_test" >> "$GITHUB_ENV"
          echo "CI=true" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra platform
      - name: Verify postgres connectivity
        run: |
          uv run python -c "
          import os, psycopg
          url = os.environ['WHETSTONE_TEST_DATABASE_URL']
          psycopg.connect(url.replace('postgresql+psycopg://', 'postgresql://', 1)).close()
          print('postgres reachable')
          "
      - run: bash scripts/pre-check.sh

  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to succeed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "all matrix jobs succeeded"
