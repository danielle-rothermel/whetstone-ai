name: Whetstone Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Authorize private dr-* git deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_DR_ORG_REPOS_READ_TOKEN }}@github.com/danielle-rothermel/".insteadOf "https://github.com/danielle-rothermel/"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dr-code build toolchain
        run: npm install --global pnpm@11.9.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: ./scripts/ci/lint.sh

  unit:
    name: Unit tests
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Authorize private dr-* git deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_DR_ORG_REPOS_READ_TOKEN }}@github.com/danielle-rothermel/".insteadOf "https://github.com/danielle-rothermel/"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dr-code build toolchain
        run: npm install --global pnpm@11.9.0
      - name: Unit tests
        run: ./scripts/ci/unit.sh

  process-integration:
    name: Process integration tests
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Authorize private dr-* git deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_DR_ORG_REPOS_READ_TOKEN }}@github.com/danielle-rothermel/".insteadOf "https://github.com/danielle-rothermel/"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dr-code build toolchain
        run: npm install --global pnpm@11.9.0
      - name: Process integration tests
        run: ./scripts/ci/process-integration.sh

  sqlite-time-integration:
    name: SQLite time integration tests
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Authorize private dr-* git deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_DR_ORG_REPOS_READ_TOKEN }}@github.com/danielle-rothermel/".insteadOf "https://github.com/danielle-rothermel/"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dr-code build toolchain
        run: npm install --global pnpm@11.9.0
      - name: SQLite time integration tests
        run: ./scripts/ci/sqlite-time-integration.sh

  sqlite-contention:
    name: SQLite contention tests
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Authorize private dr-* git deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_DR_ORG_REPOS_READ_TOKEN }}@github.com/danielle-rothermel/".insteadOf "https://github.com/danielle-rothermel/"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dr-code build toolchain
        run: npm install --global pnpm@11.9.0
      - name: SQLite contention tests
        run: ./scripts/ci/sqlite-contention.sh

  postgres-integration:
    name: PostgreSQL and DBOS integration tests
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: whetstone
          POSTGRES_USER: whetstone
          POSTGRES_DB: whetstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whetstone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Authorize private dr-* git deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_DR_ORG_REPOS_READ_TOKEN }}@github.com/danielle-rothermel/".insteadOf "https://github.com/danielle-rothermel/"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dr-code build toolchain
        run: npm install --global pnpm@11.9.0
      - name: PostgreSQL and DBOS integration tests
        env:
          WHETSTONE_TEST_POSTGRES_DSN: postgresql://whetstone:whetstone@localhost:5432/whetstone
        run: ./scripts/ci/postgres-integration.sh

  dspy-pickle-compatibility:
    name: Python 3.14 compatibility
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Authorize private dr-* git deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_DR_ORG_REPOS_READ_TOKEN }}@github.com/danielle-rothermel/".insteadOf "https://github.com/danielle-rothermel/"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dr-code build toolchain
        run: npm install --global pnpm@11.9.0
      - name: Install dependencies
        run: uv sync --frozen --python 3.14
      - name: Verify frozen DSPy Example pickle bytes
        run: uv run --python 3.14 pytest -q tests/optimization/miprov2/test_bootstrap.py -k repeated_trace_pickle
      - name: Verify deterministic Python 3.14 contracts
        run: ./scripts/ci/python-314-contracts.sh

  built-wheel-smoke:
    name: Built wheel smoke (Python 3.13)
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Authorize private dr-* git deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_DR_ORG_REPOS_READ_TOKEN }}@github.com/danielle-rothermel/".insteadOf "https://github.com/danielle-rothermel/"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dr-code build toolchain
        run: npm install --global pnpm@11.9.0
      - name: Built wheel smoke
        run: ./scripts/ci/wheel-smoke.sh
