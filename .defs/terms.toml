#:schema ./terms.schema.json

# Shared vocabulary for Whetstone. Definitions stay conceptual; code mappings
# live only in exported_symbols.

[[terms]]
name = "graph definition"
definition = """
A native dr-graph template whose declared variables are assigned to produce a \
concrete graph config."""
categories = ["experiment identity"]

[[terms]]
name = "graph config"
definition = """
The complete static, output-affecting configuration of a computation graph."""
categories = ["experiment identity"]

[[terms]]
name = "graph hash"
definition = """
The native full identity hash of a graph config. Whetstone carries this \
identity; it does not create a parallel graph identity."""
categories = ["experiment identity"]
part_of = ["evaluation evidence"]

[[terms]]
name = "evaluation role"
definition = """
The closed internal or official role carried by an evaluation binding. An \
official role requires named authority; an internal role forbids it."""
exported_symbols = ["whetstone.core.roles.EvaluationRole"]
categories = ["evaluation"]
part_of = ["evaluation binding"]

[[terms]]
name = "evaluation binding"
definition = """
The immutable policy and realized-environment context for an evaluation, \
including its exact evaluation config, role, campaign, authority, execution \
policies, and environment fingerprint."""
exported_symbols = ["whetstone.experiment.binding.EvaluationBinding"]
categories = ["evaluation", "experiment identity"]
part_of = ["evaluation intent", "evaluation evidence"]

[[terms]]
name = "evaluation intent"
definition = """
An immutable measurement request that binds an exact candidate, target \
evaluation config, evaluation binding, purpose, run, and step before execution."""
exported_symbols = ["whetstone.optimization.contracts.EvaluationIntent"]
categories = ["evaluation", "optimization"]

[[terms]]
name = "evaluation evidence"
definition = """
The content-addressed terminal record for one candidate evaluation, binding \
its graph, dataset revision (dataset_hash), ordered task_hashes, num_samples, \
task-and-sample plan, outputs, component traces, aggregate, and optional \
reward to the exact evaluation context."""
exported_symbols = ["whetstone.evaluation.schema.EvaluationEvidence"]
categories = ["evaluation", "experiment identity"]

[[terms]]
name = "provider call attempt"
definition = """
One completed logical provider attempt whose call identity, ordinal, execution \
policy, timing, transport evidence, and semantic classification agree exactly."""
exported_symbols = ["whetstone.provider.ProviderCallAttempt"]
categories = ["provider execution"]
part_of = ["provider call result"]

[[terms]]
name = "provider call result"
definition = """
The terminal semantic result of one logical provider call, containing its \
ordered completed attempts and exactly one final generation or semantic \
failure."""
exported_symbols = ["whetstone.provider.ProviderCallResult"]
categories = ["provider execution"]

[[terms]]
name = "task"
definition = """
A single element of the dataset."""
exported_symbols = ["whetstone.envs.task.Task"]
categories = ["dataset"]

[[terms]]
name = "task hash"
definition = """
The stable full identity hash of one task's identity payload. Distinct from \
task_id, the human-readable env identifier."""
categories = ["dataset", "hashing"]

[[terms]]
name = "sample"
definition = """
One fresh generation for a given task. For the encoder-decoder setup, one full \
encode-decode run."""
exported_symbols = ["whetstone.evaluation.plan.Sample"]
categories = ["dataset", "sampling"]

[[terms]]
name = "num samples"
definition = """
The number of samples per task."""
exported_symbols = ["whetstone.evaluation.plan.SamplePlan"]
categories = ["dataset", "sampling"]

[[terms]]
name = "sample index"
definition = """
The position of one sample among a task's num samples, in \
[0, num_samples - 1]."""
exported_symbols = ["whetstone.evaluation.plan.SampleId"]
categories = ["dataset", "sampling"]

[[terms]]
name = "task index"
definition = """
The position of one task among the full dataset, ordered according to the \
dataset's defined canonical ordering."""
exported_symbols = ["whetstone.evaluation.schema.EvaluationOutputRow"]
categories = ["dataset"]

[[terms]]
name = "generation graph"
definition = """
The structure of the steps of the flow used to convert task input into task \
outputs that will then be scored."""
exported_symbols = ["whetstone.envs.factory.RolloutDefinitionLike"]
categories = ["generation"]

[[terms]]
name = "generation"
definition = """
One run of the generation graph."""
exported_symbols = ["whetstone.provider.classification.Generation"]
categories = ["generation"]

[[terms]]
name = "generation index"
definition = """
A (task index, sample index) tuple that defines a specific planned generation \
slot."""
exported_symbols = ["whetstone.evaluation.schema.EvaluationOutputRow"]
categories = ["generation", "sampling"]

[[terms]]
name = "dataset hash"
definition = """
The identity hash of a dataset revision or manifest. Distinct from the ordered \
task-set identity carried by sampling configuration."""
categories = ["dataset", "hashing"]
part_of = ["evaluation evidence"]

[[terms]]
name = "request hash"
definition = """
The canonical identity hash of a provider request payload. Whetstone-owned \
persisted records use request_hash; external dr_providers evidence may retain \
request_identity under its own schema."""
categories = ["provider execution", "hashing"]

[[terms]]
name = "config hash"
definition = """
The identity hash of a typed configuration record, paired with its exact typed \
record reference (for example EvalConfigRef.config_hash or \
OptimizationRunRef.config_hash)."""
exported_symbols = [
    "whetstone.experiment.binding.EvalConfigRef",
    "whetstone.optimization.contracts.OptimizationRunRef",
]
categories = ["hashing"]

[[terms]]
name = "record hash"
definition = """
The identity hash dimension of an IdentityRef, addressing one stored record \
alongside its typed content reference."""
exported_symbols = ["whetstone.core.identity.IdentityRef"]
categories = ["hashing"]

[[terms]]
name = "objective"
definition = """
A named, direction-bearing official-selection criterion derived \
deterministically from an eligible score or aggregate. Not reward, \
which is optimizer-facing."""
exported_symbols = ["whetstone.experiment.Objective"]
categories = ["optimization", "selection"]

[[terms]]
name = "reward"
definition = """
An optimizer-facing value bound to its reward policy and the exact aggregate \
evidence it scalarizes. It is not an objective and is never an \
official-selection criterion."""
exported_symbols = ["whetstone.experiment.reward.RewardRef"]
categories = ["optimization", "evaluation"]

[[terms]]
name = "code_comp env"
definition = """
The unified HumanEval code-compression environment identity. Direct generation, \
encoder-decoder, and behavioral-mutant experiment modes share env=code_comp and \
differ by CodeCompMode subset."""
exported_symbols = [
    "whetstone.envs.code_comp.CODE_COMP_ENV_NAME",
    "whetstone.envs.code_comp.CodeCompMode",
    "whetstone.envs.code_comp.code_comp_identity_prefix",
]
categories = ["experiment identity", "evaluation"]

[[terms]]
name = "code_comp mode"
definition = """
One HumanEval compression experiment subset under the code_comp env: direct \
(single-shot generation), encdec (encoder-decoder), or encdec_mutant \
(mutant oracle scoring)."""
exported_symbols = ["whetstone.envs.code_comp.CodeCompMode"]
categories = ["experiment identity"]

[[terms]]
name = "code_comp row request schema"
definition = """
The persisted row-request schema for one code_comp evaluation mode: \
code_comp_direct_row_request for direct generation and \
code_comp_encdec_row_request for encoder-decoder rollouts."""
exported_symbols = [
    "whetstone.evaluation.drivers.code_comp.DirectRowRequest",
    "whetstone.evaluation.drivers.code_comp.EncDecRowRequest",
]
categories = ["evaluation", "experiment identity"]

[[terms]]
name = "encdec copro proposal contract"
definition = """
The instruction mutation contract for code_comp encdec COPRO proposals, \
including the canonical encoder body and budget ratio."""
exported_symbols = [
    "whetstone.optimization.copro.code_comp.EncDecCoproProposalContract",
    "whetstone.optimization.copro.code_comp.encdec_copro_proposal_contract",
]
categories = ["optimization", "experiment identity"]
