# Binding contracts for Whetstone. Statements are present-tense rules; checks
# name the repository commands that verify them.

[[contracts]]
title = "Evaluation roles bind authority and reward semantics"
statement = """
Every evaluation binding spells its role explicitly: official bindings require \
an authority principal and internal bindings forbid one; internal evaluation \
intents require their expected reward-policy hash and official intents forbid \
one."""
rationale = """
Role, authority, and optimizer-facing reward policy change the meaning of an \
evaluation. Keeping them in one validated binding prevents reporting or replay \
from relabeling internal evidence as official evidence."""
date = "2026-08-05"
check = "uv run pytest -q tests/experiment/test_binding.py tests/optimization/test_schema_semantics.py"

[[contracts]]
title = "Provider results preserve exact attempt evidence"
statement = """
Each provider attempt contains exactly one generation or semantic failure that \
reclassifies its transport evidence, and each provider result contains \
contiguous attempts with one shared call and policy identity whose last \
classification is the terminal result."""
rationale = """
Retry history is evidence, not incidental logging. Preserving its order and \
identity keeps terminal outcomes attributable to the exact request and policy \
that produced them."""
date = "2026-08-05"
check = "uv run pytest -q tests/provider/test_attempt_result.py"

[[contracts]]
title = "Evaluation matrices have complete row accounting"
statement = """
Every planned task-and-repeat cell appears exactly once in evaluation outputs \
and is accounted for exactly once in aggregate row counts: scored rows are \
present, while unscored rows are exactly one of missing, failed, or invalid; \
numeric zero remains a scored value."""
rationale = """
Silently dropping absent or failed work changes denominators and can turn \
incomplete execution into apparently better measurements. Explicit states \
keep reductions and provenance faithful to the full plan."""
date = "2026-08-05"
check = "uv run pytest -q tests/evaluation/code/test_aggregate.py tests/evaluation/test_engine.py"

[[contracts]]
title = "Persisted evaluation references address exact records"
statement = """
Evaluation bindings, outputs, component traces, aggregates, rewards, and \
terminal evidence use their declared schemas and content-address the exact \
serialized records they reference."""
rationale = """
Schema labels without content agreement allow forged or drifted records to \
reuse trusted identities. Exact record references make replay and recovery \
validate the same evidence that originally completed the evaluation."""
date = "2026-08-05"
check = "uv run pytest -q tests/experiment/test_binding.py tests/evaluation/test_engine.py"

[[contracts]]
title = "Reward is not an objective"
statement = """
Reward remains optimizer-facing and is never accepted as an official-selection \
objective, including under case variants of its reserved name."""
rationale = """
An optimizer may train against a reward policy, while official selection must \
remain attributable to direction-bearing criteria derived from eligible \
evaluation evidence. Treating reward as an objective collapses those distinct \
authorities."""
date = "2026-08-05"
check = "uv run pytest -q tests/experiment/test_objectives.py"

[[contracts]]
title = "Codex typed execution and filesystem isolation fail closed"
statement = """
The subprocess Codex runner launches its sandbox-wrapped command through the \
pinned dr-exec typed PROCESS_BOUNDARY_ONLY execution contract. Production \
composition requires an isolated host Python runtime and a caller-owned \
absolute durable directory run store whose root is not granted to the child. \
The runner refuses to execute unless macOS sandbox-exec is available, requires \
absolute paths for declared durable Whetstone state, and builds a filesystem \
profile for its staged runtime and declared state paths. A configured partial \
log grants write access to its parent directory. The boundary does not claim \
network containment, secrecy of an explicitly supplied provider credential, \
Codex CLI version compatibility, full descendant-process containment, or \
hermetic execution."""
rationale = """
Codex and its MCP child need a small runtime, exact durable stores, and provider \
access, but they must not inherit ambient host filesystem authority or the \
executor's record root. Typed process-boundary execution records the exact \
declared scope without strengthening it. Refusing unsupported platforms keeps \
the filesystem guarantee truthful; network, credential, descendant-process, \
and hermetic containment require separate designs and are not implied by the \
filesystem profile. Partial-log parent authority remains explicit because the \
durable log opens records and its sibling lock through that directory."""
date = "2026-08-06"
check = "uv run pytest -q tests/optimization/codex/test_runner.py"

[[contracts]]
title = "Codex MCP ingress uses the pinned official protocol boundary"
statement = """
The Codex MCP server delegates JSON-RPC framing, protocol negotiation, and \
tool-input validation to the pinned official MCP SDK before Whetstone \
constructs a ToolCall. Whetstone owns translation between the declared \
evaluation-tool contract and its durable tool store."""
rationale = """
MCP is an external serialization boundary. Pinning its authoritative protocol \
implementation prevents a partial local reimplementation from silently \
accepting malformed envelopes or drifting from the negotiated wire contract, \
while keeping Whetstone-specific evaluation semantics locally explicit."""
date = "2026-08-06"
check = "uv run pytest -q tests/optimization/codex/test_mcp_bridge.py tests/optimization/codex/test_mcp_server.py"

[[contracts]]
title = "Codex artifacts are accepted on proposal shape"
statement = """
The Codex adapter accepts a typed artifact only when its run identity, proposal \
count, requested base references, configured base distinctness, and allowed \
mutation surface are valid. MCP measurement is optional; calls that occur are \
admitted and accounted by the tool store rather than matched to proposals."""
rationale = """
The Codex step is an opaque optimizer boundary whose durable output is its typed \
proposal artifact. Requiring one successful MCP call per proposal is a stronger \
measurement protocol than this adapter implements, so the standing contract \
states the structural acceptance rule instead of implying that guarantee."""
date = "2026-08-06"
check = "uv run pytest -q tests/optimization/codex/test_adapter.py"

[[contracts]]
title = "Issued tool call IDs identify one exact call"
statement = """
Within one durable optimization step, every call_id identifies exactly one \
exact ToolCall. Retries and concurrent recovery reuse that same call; issuers \
do not submit different calls under one ID."""
rationale = """
The current storage boundary publishes the call-ID claim and ordinal slot \
through separate immutable bindings. An incompatible same-ID race can reserve \
a losing slot before the claim conflict is recognized, leaving the durable \
prefix unreadable and consuming capacity. Binding the claim first is rejected \
because a crash before slot publication would omit the attempted call from \
replay. Removing this caller restriction requires an all-or-nothing \
multi-binding transaction in dr-store that publishes the claim and slot \
together, retries only ordinal conflicts, and publishes no losing slot."""
date = "2026-08-06"

[[contracts]]
title = "MIPROv2 replay binds one exact run and proposal route"
statement = """
Every persisted MIPROv2 runtime, proposal request, candidate assembly, and \
study transcript binds the exact optimization run and optimizer configuration. \
The runtime also binds the proposal executor policy and proposer transport \
durability identity used for paid proposal effects."""
rationale = """
Run IDs and route configuration alone do not prove which authority produced a \
candidate. Exact content-addressed bindings make replay reject a different \
run, optimizer record, executor policy, or transport before external work."""
date = "2026-08-06"
check = "uv run pytest -q tests/optimization/miprov2 tests/optimization/proposal/test_proposer.py tests/optimization/test_template_validation.py"

[[contracts]]
title = "MIPROv2 effects preserve row budgets and renderable evidence"
statement = """
MIPROv2 records task-row consumption with every bootstrap and evaluation \
effect, verifies the durable budget ceiling at each entry, and preflights the \
next row batch before resolver, storage, or provider activity. Candidate \
rendering protects literal JSON under the exact render contract and rejects \
literal-replacement content containing an active field token outside the \
instruction surface."""
rationale = """
Evaluation counts without row counts can overspend batched work, while lossy \
template composition can silently turn recorded evidence into live input. \
Failing before either boundary keeps replay accounting and candidate meaning \
stable."""
date = "2026-08-06"
check = "uv run pytest -q tests/optimization/miprov2/test_adapter.py tests/optimization/miprov2/test_replay_policy.py tests/optimization/miprov2/test_runtime.py"
