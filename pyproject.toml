[project]
name = "whetstone-ai"
version = "0.1.0"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13, <3.15"
dependencies = [
    "dr-exec==0.1.11",
    "dr-graph==0.1.3",
    "dr-providers==0.3.1",
    "dr-serialize==0.1.2",
    "dr-store==0.2.3",
    "gepa==0.1.1",
    "mcp==2.0.0",
    "numpy>=2.5.1",
    "optuna==4.8.0",
    "typer>=0.26.8",
    "rich>=15.0.0",
]
[project.optional-dependencies]
dbos = ["dbos>=2.25.0"]
postgres = ["psycopg[binary]>=3.3.4"]
platform = [
  "dr-platform",
  "dbos>=2.25.0",
  "psycopg[binary]>=3.3.4",
]

[tool.uv.sources]
dr-platform = { path = "../../repos/dr-platform", editable = true }
[dependency-groups]
dev = [
    "rich>=15.0.0",
    "pytest>=8.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires postgres + dbos + dr-platform",
    "slow: long-running",
]
addopts = "-m 'not integration and not slow'"
[project.scripts]
whetstone-mcp-eval = "whetstone.optim.codex.mcp_server:main"
whetstone-sandbox = "whetstone.sandbox.cli:main"
whetstone-optim = "whetstone.platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]
