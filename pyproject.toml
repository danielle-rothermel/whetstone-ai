[project]
name = "whetstone-ai"
version = "0.1.0"
description = "Typed, durable evaluation and prompt-optimization contracts for reproducible Whetstone experiments"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13, <3.15"
dependencies = [
    "dbos>=2.25.0",
    "dr-code==0.1.3",
    "dr-exec==0.1.4",
    "dr-graph==0.1.2",
    "dr-providers==0.2.2",
    "dr-serialize==0.1.2",
    "dr-store==0.1.4",
    "gepa==0.1.1",
    "mcp==2.0.0",
    "numpy>=2.5.1",
    "optuna==4.8.0",
    "psycopg[binary]>=3.3.4",
    "typer>=0.26.8",
    "whetstone-envs",
    "zstandard>=0.25.0",
]

[project.scripts]
whetstone-validate = "whetstone.runner.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.10",
    "ty>=0.0.54",
]

[tool.uv.sources]
whetstone-envs = { git = "https://github.com/danielle-rothermel/whetstone-envs", rev = "90729bda2b207a845b1b7e499754f9b913201a40" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]

[tool.ruff]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
line-length = 79
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "precheck: small deterministic contract and smoke selection for the local commit gate",
    "process_integration: exercises observed spawned-process and process-group behavior",
    "process_guardian: exercises observed guardian and parent-death behavior",
    "postgres_integration: exercises live PostgreSQL and DBOS behavior",
    "sqlite_time_integration: exercises SQLite behavior against real elapsed time",
    "sqlite_contention: exercises SQLite behavior under concurrent access",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep" = { msg = "tests must use synchronization primitives or controlled clocks" }
"asyncio.sleep" = { msg = "tests must use synchronization primitives or controlled clocks" }
"anyio.sleep" = { msg = "tests must use synchronization primitives or controlled clocks" }
"trio.sleep" = { msg = "tests must use synchronization primitives or controlled clocks" }

[tool.ruff.lint.isort]
known-first-party = ["whetstone"]

[tool.ty.environment]
extra-paths = ["..", "tests"]

[tool.ty.src]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
