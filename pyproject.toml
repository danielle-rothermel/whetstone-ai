[project]
name = "whetstone-ai"
version = "0.1.7"
description = "Generic toolkit for evaluating and optimizing LLM prompts and programs."
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13, <3.15"
dependencies = [
    "dr-exec==0.1.14",
    "dr-graph==0.1.3",
    "dr-providers==0.3.2",
    "dr-serialize==0.1.2",
    "dr-store==0.2.6",
    "gepa==0.1.1",
    "mcp==2.0.0",
    "numpy>=2.5.1",
    "optuna==4.8.0",
    "typer>=0.26.8",
    "rich>=15.0.0",
    # whetstone hosts the Codex evaluation endpoint itself, outside the
    # agent's sandbox, so the HTTP server is a runtime dependency.
    "uvicorn>=0.52.0",
]
[project.optional-dependencies]
dbos = ["dbos>=2.25.0"]
postgres = ["psycopg[binary]>=3.3.4"]
platform = [
  "dr-platform==0.2.7",
  "dbos[otel]==2.27.0",
  "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "rich>=15.0.0",
    "pytest>=8.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires postgres + dbos + dr-platform",
]
addopts = "-m 'not integration'"
[project.urls]
Repository = "https://github.com/danielle-rothermel/whetstone-ai"
Issues = "https://github.com/danielle-rothermel/whetstone-ai/issues"

[project.scripts]
whetstone-sandbox = "whetstone.sandbox.cli:main"
whetstone-optim = "whetstone.platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.sdist]
only-include = ["src"]
[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]
