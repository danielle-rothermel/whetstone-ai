[project]
name = "whetstone-ai"
version = "0.1.0"
description = "Typed graph, provider-execution, language-model, and evaluation-failure foundations"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13, <3.15"
dependencies = [
    "dr-code",
    "dr-graph>=0.1.0,<0.2",
    "dr-providers>=0.2.0,<0.3",
    "dr-serialize>=0.1.0,<0.2",
    "dr-store>=0.1.0,<0.2",
    "numpy>=2.5.1",
    "psycopg[binary]>=3.3.4",
    "zstandard>=0.25.0",
]

[dependency-groups]
# dbos is test-only: failure-policy tests verify classification behavior
# against its real error types.
dev = [
    "dbos>=2.25.0",
    "pre-commit>=4.6.0",
    "pytest>=8.4.2",
    "ruff>=0.15.10",
    "ty>=0.0.54",
]

# Unreleased dr-* packages use exact reviewed revisions.
[tool.uv.sources]
dr-code = { git = "https://github.com/danielle-rothermel/dr-code", rev = "5810f30dede14094fcf1b8f1cce95d73a1055c84" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]

[tool.ruff]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
line-length = 79
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "process_integration: exercises real spawned process and process-group boundaries",
    "process_guardian: exercises guardian and parent-death containment",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep" = { msg = "tests must use synchronization primitives or controlled clocks" }
"asyncio.sleep" = { msg = "tests must use synchronization primitives or controlled clocks" }
"anyio.sleep" = { msg = "tests must use synchronization primitives or controlled clocks" }
"trio.sleep" = { msg = "tests must use synchronization primitives or controlled clocks" }

[tool.ruff.lint.isort]
known-first-party = ["whetstone"]

[tool.ty.environment]
extra-paths = ["..", "tests"]

[tool.ty.src]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
